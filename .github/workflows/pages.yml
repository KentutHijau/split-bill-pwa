name: Validate and deploy Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
        if: ${{ hashFiles('package-lock.json') != '' }}

      - name: Set up Node.js without dependency cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
        if: ${{ hashFiles('package-lock.json') == '' }}

      - name: Install locked dependencies
        run: npm ci
        if: ${{ hashFiles('package-lock.json') != '' }}

      # Temporary bootstrap path: replace this with an unconditional npm ci after
      # committing the first genuine package-lock.json generated by npm.
      - name: Install dependencies without a lockfile
        run: npm install
        if: ${{ hashFiles('package-lock.json') == '' }}

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Verify Smart Scan production configuration
        run: |
          node <<'NODE'
          const { VITE_SUPABASE_URL: rawUrl, VITE_SUPABASE_PUBLISHABLE_KEY: key } = process.env;
          if (!rawUrl) throw new Error('VITE_SUPABASE_URL repository variable is required');
          if (!key) throw new Error('VITE_SUPABASE_PUBLISHABLE_KEY repository variable is required');
          let url;
          try {
            url = new URL(rawUrl);
          } catch {
            throw new Error('VITE_SUPABASE_URL must be a valid URL');
          }
          const validHost = /^[a-z0-9-]+\.supabase\.co$/i.test(url.hostname);
          const validBase =
            url.protocol === 'https:' &&
            validHost &&
            !url.username &&
            !url.password &&
            !url.port &&
            (url.pathname === '/' || url.pathname === '') &&
            !url.search &&
            !url.hash;
          if (!validBase)
            throw new Error('VITE_SUPABASE_URL must be an https://*.supabase.co base URL');
          NODE
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Build production application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Configure GitHub Pages
        if: ${{ github.event_name == 'push' }}
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: ${{ github.event_name == 'push' }}
    needs: validate-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
